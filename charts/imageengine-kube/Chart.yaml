annotations:
  artifacthub.io/signKey: |
    fingerprint: C3A55111ED91FEDE4A82A4B4463266060957C4B3
    url: https://kube.imageengine.io/pubkey.asc
  artifacthub.io/changes: |
    - kind: added
      description: "edge.widthSync.enabled (default false): the edges of a release share the natural image widths they learn. A new or restarted edge copies another edge's width cache before it becomes Ready (at most 15 s) and loads its own snapshot from a pod-local emptyDir after a container restart, and every edge picks up the widths the others learn within about a second. Without it, every new edge starts with an empty cache and requests uncapped variants that miss Varnish and the backend's caches until it relearns them. Adds a headless Service for the edges to find each other on the admin port, an edge PodDisruptionBudget, a surge-only edge rollout and the emptyDir. See CUSTOMIZATIONS.md, \"How do I keep the edge's width cache warm?\"."
    - kind: added
      description: "edge.widthSync.networkPolicy: an optional NetworkPolicy that limits the edge admin port (9464) to the release's own edges and the scrapers you list in metricsFrom, while customer traffic on 8080 stays open."
    - kind: changed
      description: "Updated the edge image to 4.11.0, which adds the width cache sharing (off unless edge.widthSync.enabled)."
    - kind: added
      description: "TROUBLESHOOTING.md: \"An edge roll stalls with one new pod missing\" (a ResourceQuota without room for the surge pod) and \"An edge starts with an empty width cache\" (what each imageengine_edge_kvcache_bootstrap_total result means)."
