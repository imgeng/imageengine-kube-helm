{{- if (.Values.httpRoute | default dict).enabled -}}
{{- if not .Values.httpRoute.parentRefs -}}
{{- fail "httpRoute.parentRefs must name at least one Gateway when httpRoute.enabled is true" -}}
{{- end -}}
{{- /* Same target as the Ingress: the edge Service, or the backend Service on a
       backend-only install (frontend.enabled=false). */ -}}
{{- $svcName := printf "%s-edge" (include "imageengine.fullname" .) -}}
{{- $svcPort := .Values.service.port -}}
{{- if not .Values.frontend.enabled -}}
{{- $svcName = printf "%s-backend" (include "imageengine.fullname" .) -}}
{{- $svcPort = .Values.backend.service.port | default 80 -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "imageengine.fullname" . }}-httproute
  {{- with .Values.httpRoute.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ $svcName }}
          port: {{ $svcPort }}
      {{- with (.Values.httpRoute.timeouts | default dict).request }}
      timeouts:
        request: {{ . | quote }}
      {{- end }}
{{- end }}
